name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the web client
        run: npm run build --workspace @calliope/web

  play:
    name: Play a few hands in a browser
    runs-on: ubuntu-latest
    # The engine is covered by unit tests; this proves the whole stack actually
    # deals a hand, including the two games with a discard round.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calliope
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: calliope
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calliope -d calliope"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://calliope:ci-password@localhost:5432/calliope
      REDIS_URL: redis://localhost:6379
      PORT: 3000
      PUBLIC_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build the web client
        run: npm run build --workspace @calliope/web

      - name: Start the server
        run: |
          WEB_DIST="$PWD/packages/web/dist" npx tsx packages/server/src/index.ts &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health

      - name: Dealer's choice stays on screen
        run: npm run e2e:dealers-choice --workspace @calliope/web
        env:
          BASE: http://localhost:3000
          OUT: ${{ runner.temp }}/shots
          SECONDS: 40

      - name: Pineapple and five-card draw play through
        run: npm run e2e:draw-games --workspace @calliope/web
        env:
          BASE: http://localhost:3000
          OUT: ${{ runner.temp }}/shots

      - name: The lobby guards the deal, cancels and shares
        run: npm run e2e:lobby-and-sharing --workspace @calliope/web
        env:
          BASE: http://localhost:3000
          OUT: ${{ runner.temp }}/shots

      - name: The turn rings a bell and clears the pot
        run: npm run e2e:turn-notification --workspace @calliope/web
        env:
          BASE: http://localhost:3000
          OUT: ${{ runner.temp }}/shots

      - name: The night report settles up in cash
        run: npm run e2e:night-report --workspace @calliope/web
        env:
          BASE: http://localhost:3000
          OUT: ${{ runner.temp }}/shots
          SECONDS: 25

      - name: Every game fits every screen shape
        run: npm run e2e:layout --workspace @calliope/web
        env:
          BASE: http://localhost:3000
          OUT: ${{ runner.temp }}/shots
          # A phone, a phone on its side and a laptop, at full tables; the
          # full matrix is for local runs.
          COUNTS: '8'
          VIEWPORTS: 360x640,844x390,1280x800

      - name: Cards draw sharp from the starter deck
        run: npm run e2e:decks --workspace @calliope/web
        env:
          BASE: http://localhost:3000
          OUT: ${{ runner.temp }}/shots

      - name: Keep the screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  deploy:
    name: Deploy to apps
    # Only after both jobs pass, and only for main. Never add pull_request_target
    # or workflow_run to this file: both hand repo secrets to code from forks.
    needs: [check, play]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask bferg314/deploys to deploy this commit
        env:
          TOKEN: ${{ secrets.DEPLOYS_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bferg314/deploys/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"app\":\"calliope-poker\",\"sha\":\"$GITHUB_SHA\"}}"
